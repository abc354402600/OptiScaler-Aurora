name: clang-format Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  formatting-check:
    name: Formatting Check (changed lines)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install pinned formatter
      run: python -m pip install clang-format==20.1.8
    - name: Test incremental selection
      run: python -m unittest discover -s tests -p test_clang_format_changed.py -v
    - name: Check added and modified C/C++ lines
      run: python scripts/clang_format_changed.py
